name = "buttiscreen-contact"
main = "contact.js"
compatibility_date = "2025-01-01"

[vars]
MAIL_TO = "contact@buttiscreen.fr"
MAIL_FROM = "Buttiscreen <brief@buttiscreen.fr>"

# Secret à définir hors du dépôt : npx wrangler secret put RESEND_API_KEY

# Accusé de réception au visiteur : actif parce que ce KV est lié (limite par adresse et par IP).
[[kv_namespaces]]
binding = "RATE"
id = "e286dba411574f068c0189476c39e0ad"
# REPLY_DELAY règle le délai annoncé dans l'accusé ; CONFIRMATION = "off" coupe l'accusé.
# REPLY_DELAY = "48 heures ouvrées"
